<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL Viewer - Kwantum & Mechanica</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #121212; 
            color: #eeeeee; 
            font-family: monospace; 
        }
        #ui-container { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 100; 
            background: rgba(0, 0, 0, 0.8); 
            padding: 15px; 
            border-radius: 4px;
            border: 1px solid #333;
        }
        select { 
            padding: 8px; 
            background: #222; 
            color: #00ffcc; 
            border: 1px solid #444; 
            border-radius: 4px;
            font-family: monospace;
            cursor: pointer;
            outline: none;
        }
        canvas { 
            display: block; 
        }
    </style>
    
    <script type="importmap">

        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="ui-container">
        <label for="model-select"><b>BESTAND:</b> </label>
        <select id="model-select">
            <option value="quatum.stl">quatum.stl</option>

        </select>
    </div>

        // 1. Initialiseer Scene, Camera en Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        // Voeg een subtiel ruimtelijk grid toe
        const gridHelper = new THREE.GridHelper(10, 50, 0x444444, 0x222222);
        scene.add(gridHelper);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

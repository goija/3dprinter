<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL Viewer - Auto-Fit</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #121212; 
            color: #eeeeee; 
            font-family: monospace; 
        }
        #ui-container { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 100; 
            background: rgba(0, 0, 0, 0.8); 
            padding: 15px; 
            border-radius: 4px;
            border: 1px solid #333;
        }
        select { 
            padding: 8px; 
            background: #222; 
            color: #00ffcc; 
            border: 1px solid #444; 
            border-radius: 4px;
            font-family: monospace;
            cursor: pointer;
            outline: none;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #ffaa00;
        }
    </style>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="ui-container">
        <label for="model-select"><b>BESTAND:</b> </label>
        <select id="model-select">
            <option value="quatum.stl">quatum.stl</option>
            <option value="doorsapuiklep.stl">doorsapuiklep.stl</option>
        </select>
        <div id="status">Laden...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Initialisatie
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        // Grid wordt later dynamisch geschaald op basis van het model
        let gridHelper = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
        scene.add(gridHelper);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. Krachtigere belichting (DoubleSide material om normals problemen op te vangen)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(100, 100, 100);
        scene.add(dirLight);
        
        const dirLight2 = new THREE.DirectionalLight(0x00ffcc, 1.5);
        dirLight2.position.set(-100, -100, -100);
        scene.add(dirLight2);

        // 3. Loader & Auto-Fit Logica
        const loader = new STLLoader();
        let currentMesh = null;
        const statusDiv = document.getElementById('status');
        
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x2ca02c, 
            roughness: 0.4,
            metalness: 0.1,
            side: THREE.DoubleSide // Toont ook de binnenkant als de normals verkeerd om staan
        });

        function loadModel(filename) {
            statusDiv.innerText = `Laden van ${filename}...`;
            
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
            }

            loader.load(filename, function (geometry) {
                geometry.computeVertexNormals();
                geometry.computeBoundingBox();
                
                // Bereken centrum en verplaats het model exact naar [0,0,0]
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                geometry.translate(-center.x, -center.y, -center.z);
                
                // Bepaal de maximale afmeting
                const size = new THREE.Vector3();
                geometry.boundingBox.getSize(size);
                const maxDim = Math.max(size.x, size.y, size.z);
                
                currentMesh = new THREE.Mesh(geometry, material);
                scene.add(currentMesh);
                
                // Pas het grid aan op de grootte van het model
                scene.remove(gridHelper);
                gridHelper = new THREE.GridHelper(maxDim * 2, 20, 0x444444, 0x222222);
                gridHelper.position.y = -size.y / 2; // Zet grid onder het model
                scene.add(gridHelper);

                // CAMERA AUTO-FIT LOGICA
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                cameraZ *= 1.5; // 50% extra marge rondom het model
                
                // Pas de near/far planes dynamisch aan om clipping te voorkomen
                camera.near = maxDim / 100;
                camera.far = maxDim * 100;
                camera.updateProjectionMatrix();
                
                // Zet camera schuin boven het object
                camera.position.set(cameraZ * 0.8, cameraZ * 0.5, cameraZ);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();

                statusDiv.innerText = `Geladen: ${filename} (Grootte: ${maxDim.toFixed(2)})`;

            }, undefined, function (error) {
                statusDiv.innerText = `Fout bij laden!`;
                console.error(error);
            });
        }

        // 4. Events
        const selectElement = document.getElementById('model-select');
        loadModel(selectElement.value);

        selectElement.addEventListener('change', (event) => {
            loadModel(event.target.value);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>

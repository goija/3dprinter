<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL Viewer - Lokale Bestandsupload</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #121212; 
            color: #eeeeee; 
            font-family: monospace; 
        }
        #ui-container { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 100; 
            background: rgba(0, 0, 0, 0.8); 
            padding: 15px; 
            border-radius: 4px;
            border: 1px solid #333;
        }
        input[type="file"] {
            margin-top: 10px;
            color: #00ffcc;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #ffaa00;
        }
    </style>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="ui-container">
        <label><b>KIES EEN STL BESTAND:</b></label><br>
        <input type="file" id="file-input" accept=".stl">
        <div id="status">Wacht op bestand...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Initialisatie
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        let gridHelper = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
        scene.add(gridHelper);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. Belichting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(100, 100, 100);
        scene.add(dirLight);
        
        const dirLight2 = new THREE.DirectionalLight(0x00ffcc, 1.5);
        dirLight2.position.set(-100, -100, -100);
        scene.add(dirLight2);

        // 3. Bestand inlezen en renderen
        let currentMesh = null;
        const statusDiv = document.getElementById('status');
        const loader = new STLLoader();
        
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x2ca02c, 
            roughness: 0.4,
            metalness: 0.1,
            side: THREE.DoubleSide
        });

        document.getElementById('file-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            statusDiv.innerText = `Inlezen van ${file.name}...`;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    // Gebruik parse() i.p.v. load() omdat we de ruwe data al hebben
                    const geometry = loader.parse(e.target.result);
                    toonModel(geometry, file.name);
                } catch (error) {
                    statusDiv.innerText = `Fout bij verwerken van bestand!`;
                    console.error(error);
                }
            };
            
            // Lees het bestand als een ArrayBuffer (vereist voor STL parsing)
            reader.readAsArrayBuffer(file);
        });

        function toonModel(geometry, filename) {
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
            }

            geometry.computeVertexNormals();
            geometry.computeBoundingBox();
            
            // Centreer model
            const center = new THREE.Vector3();
            geometry.boundingBox.getCenter(center);
            geometry.translate(-center.x, -center.y, -center.z);
            
            // Bereken grootte voor auto-fit
            const size = new THREE.Vector3();
            geometry.boundingBox.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z);
            
            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
            
            // Pas grid aan
            scene.remove(gridHelper);
            gridHelper = new THREE.GridHelper(maxDim * 2, 20, 0x444444, 0x222222);
            gridHelper.position.y = -size.y / 2;
            scene.add(gridHelper);

            // Camera auto-fit
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;
            
            camera.near = maxDim / 100;
            camera.far = maxDim * 100;
            camera.updateProjectionMatrix();
            
            camera.position.set(cameraZ * 0.8, cameraZ * 0.5, cameraZ);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);
            controls.update();

            statusDiv.innerText = `Succes: ${filename}`;
        }

        // 4. Venster schalen & Animatie loop
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>

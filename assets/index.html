<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D STL Viewer - doorsapuiklep.stl</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
        }
        #ui-container { 
            position: absolute; 
            top: 20px; 
            width: 100%; 
            text-align: center; 
            z-index: 100; 
            pointer-events: none; 
        }
        h1 { margin: 0; font-size: 20px; color: #4dc0e0; }
        p { margin: 5px 0 0 0; font-size: 14px; color: #aaaaaa; }
        canvas { display: block; }
    </style>
    <!-- Three.js bibliotheken inladen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui-container">
        <h1>Romeinse Houten Klepduiker</h1>
        <p>Bestand: <strong>doorsapuiklep.stl</strong> | Gebruik de muis om te draaien en in te zoomen.</p>
    </div>

    <script>
        // 1. Basis instellingen: Scene, Camera, Renderer
        let scene = new THREE.Scene();
        let camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 20, 30);

        let renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x1a1a1a);
        document.body.appendChild(renderer.domElement);

        // 2. Navigatie (OrbitControls)
        let controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 3. Verlichting
        scene.add(new THREE.AmbientLight(0x555555)); // Basislicht
        let directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 4. STL inladen
        let loader = new THREE.STLLoader();
        // Omdat ze in dezelfde map staan, is de bestandsnaam voldoende:
        loader.load('doorsapuiklep.stl', function (geometry) {
            geometry.center();
            geometry.computeVertexNormals();
            
            // Materiaal instellen (hout-achtige/klei kleur)
            let material = new THREE.MeshPhongMaterial({ 
                color: 0x8b5a2b, 
                specular: 0x111111, 
                shininess: 20 
            });
            
            let mesh = new THREE.Mesh(geometry, material);
            
            // Corrigeer de as-rotatie (vaak nodig bij STL exports)
            mesh.rotation.x = -Math.PI / 2;
            
            scene.add(mesh);
        }, 
        undefined, 
        function (error) {
            console.error('Fout bij het laden van de STL. Check CORS of bestandslocatie.', error);
        });

        // 5. Scherm aanpassingen
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Animatie loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

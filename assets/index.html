<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL Viewer - doorsapuiklep.stl</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e1e1e; color: #f0f0f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; }
        #info { position: absolute; top: 15px; width: 100%; z-index: 100; pointer-events: none; }
        h2 { margin: 0 0 5px 0; color: #4dc0e0; }
        p { margin: 0; font-size: 14px; }
        canvas { display: block; }
    </style>
    <!-- Three.js en STLLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        <h2>Romeinse Klepduiker (doorsapuiklep.stl)</h2>
        <p>Referentie: <strong>De Geometrische Sleutel van de Romeinse Infrastructuur</strong></p>
        <p><em>Gebruik de muis om te draaien (linksklik) en in te zoomen (scroll).</em></p>
    </div>

    <script>
        let scene = new THREE.Scene();
        let camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 1000 );
        camera.position.set( 30, 20, 30 );

        let renderer = new THREE.WebGLRenderer( { antialias: true } );
        renderer.setSize( window.innerWidth, window.innerHeight );
        document.body.appendChild( renderer.domElement );

        let controls = new THREE.OrbitControls( camera, renderer.domElement );
        controls.enableDamping = true;
        
        // Belichting
        scene.add( new THREE.AmbientLight( 0x404040, 1.5 ) );
        let dirLight = new THREE.DirectionalLight( 0xffffff, 1 );
        dirLight.position.set( 10, 20, 10 );
        scene.add( dirLight );

        // STL Inladen
        let loader = new THREE.STLLoader();
        loader.load( 'doorsapuiklep.stl', function ( geometry ) {
            geometry.center();
            geometry.computeVertexNormals();
            let material = new THREE.MeshPhongMaterial( { color: 0x8B4513, specular: 0x111111, shininess: 30 } );
            let mesh = new THREE.Mesh( geometry, material );
            mesh.rotation.x = -Math.PI / 2; // Zorg dat het model rechtop staat
            scene.add( mesh );
        });

        window.addEventListener( 'resize', onWindowResize, false );
        function onWindowResize(){
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize( window.innerWidth, window.innerHeight );
        }

        function animate() {
            requestAnimationFrame( animate );
            controls.update();
            renderer.render( scene, camera );
        }
        animate();
    </script>
</body>
</html>
